name: Deploy to EC2

on:
  push:
    branches: [ main ]  # main 브랜치에 push할 때 자동 실행

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/2026-capstone-83
            git pull origin main

            cd server
            ./gradlew bootJar

            # 기존 실행 중인 jar 종료
            pkill -f "itda-0.0.1-SNAPSHOT.jar" || true

            # 환경변수 설정 후 실행
            nohup java -jar \
              -DDB_URL=${{ secrets.DB_URL }} \
              -DDB_USERNAME=${{ secrets.DB_USERNAME }} \
              -DDB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              build/libs/itda-0.0.1-SNAPSHOT.jar \
              > app.log 2>&1 &
