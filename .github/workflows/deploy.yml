name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/2026-capstone-83
            git fetch origin main
            git reset --hard origin/main
            chmod +x server/gradlew

            cd server
            ./gradlew bootJar

            pkill -f "itda-0.0.1-SNAPSHOT.jar" || true

            bash -c 'nohup java \
              -DDB_URL=${{ secrets.DB_URL }} \
              -DDB_USERNAME=${{ secrets.DB_USERNAME }} \
              -DDB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -jar /home/ec2-user/2026-capstone-83/server/build/libs/itda-0.0.1-SNAPSHOT.jar \
              > /home/ec2-user/app.log 2>&1 &
            disown'
            
            sleep 5

            echo "Deploy completed"